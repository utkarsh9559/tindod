<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign Up - TinDog</title>
  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Ubuntu:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">
  <style>
    .signup-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px;
      background-color: #f9f9f9;
      border-radius: 8px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
    }
    .signup-heading {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2rem;
      color: #333;
    }
    .form-control {
      border-radius: 0.5rem;
    }
    .btn-custom {
      background-color: #007bff;
      color: white;
      border-radius: 0.5rem;
      padding: 10px 20px;
    }
    .btn-custom:hover {
      background-color: #0056b3;
    }
    .form-group {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <a class="navbar-brand" href="index.html">TinDog</a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <a class="nav-link" href="index.html#footer">Contact</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="index.html#pricing">Pricing</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="index.html#cta">Download</a>
      </li>
    </ul>
  </div>
</nav>

<!-- Sign-Up Section -->
<section id="signup" class="py-5 bg-light">
  <div class="container">
    <div class="signup-container">
      <h2 class="signup-heading">Create Your Account</h2>
      <form action="#" method="POST">
        <!-- Full Name Field -->
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="full-name" class="form-control" placeholder="Enter your full name" required>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" class="form-control" placeholder="Confirm your password" required>
        </div>

        <!-- Phone Number Field -->
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="Enter your phone number" required>
        </div>

        <!-- Dog Type Selection -->
        <div class="form-group">
          <label for="dog-type">Dog's Breed</label>
          <select id="dog-type" name="dog-type" class="form-control" required>
            <option value="">Select Dog's Breed</option>
            <option value="chihuahua">Chihuahua</option>
            <option value="labrador">Labrador</option>
            <option value="bulldog">Bulldog</option>
            <option value="poodle">Poodle</option>
            <option value="golden_retriever">Golden Retriever</option>
            <option value="beagle">Beagle</option>
            <option value="german_shepherd">German Shepherd</option>
            <option value="boxer">Boxer</option>
            <option value="dalmatian">Dalmatian</option>
          </select>
        </div>

        <!-- Terms and Conditions -->
        <div class="form-group form-check">
          <input type="checkbox" class="form-check-input" id="terms" required>
          <label class="form-check-label" for="terms">I agree to the <a href="#">Terms & Conditions</a></label>
        </div>

        <!-- Submit Button -->
        <div class="form-group text-center">
          <button type="submit" class="btn btn-custom">Sign Up</button>
        </div>
      </form>
    </div>
  </div>
</section>

<!-- Footer Section -->
<footer id="footer" class="text-center py-4 bg-dark text-white">
  <i class="fab fa-instagram social-icon"></i>
  <i class="fab fa-facebook social-icon"></i>
  <i class="fab fa-twitter social-icon"></i>
  <i class="fas fa-envelope social-icon"></i>
  <p>© 2025 TinDog</p>
</footer>

<!-- Bootstrap JS and Custom Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
