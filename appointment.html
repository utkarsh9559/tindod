<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment | TinDog</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Appointment Booking Section -->
<section class="container py-5">
  <h2 class="text-center">Book Your Appointment</h2>
  <form id="appointment-form" class="col-md-6 offset-md-3">
    
    <!-- Doctor Selection -->
    <div class="mb-3">
      <label for="doctor" class="form-label">Select Doctor</label>
      <select id="doctor" class="form-select" required>
        <option value="">Choose a doctor</option>
        <option value="dr_smith">Dr. Smith - Veterinarian</option>
        <option value="dr_jones">Dr. Jones - Veterinarian</option>
        <option value="dr_brown">Dr. Brown - Veterinary Surgeon</option>
      </select>
    </div>
    
    <!-- Date Selection -->
    <div class="mb-3">
      <label for="appointment-date" class="form-label">Select Date</label>
      <input type="date" class="form-control" id="appointment-date" required>
    </div>

    <!-- Time Selection -->
    <div class="mb-3">
      <label for="appointment-time" class="form-label">Select Time</label>
      <select id="appointment-time" class="form-select" required>
        <option value="">Choose a time</option>
        <option value="10:00">10:00 AM</option>
        <option value="11:00">11:00 AM</option>
        <option value="12:00">12:00 PM</option>
        <option value="02:00">02:00 PM</option>
        <option value="03:00">03:00 PM</option>
      </select>
    </div>

    <!-- Submit Appointment Button -->
    <button type="button" class="btn btn-primary w-100" onclick="submitAppointment()">Book Appointment</button>
  </form>
  
  <div class="text-center mt-4" id="appointment-feedback"></div>
</section>

<script src="scripts.js"></script>
</body>
</html>
